name: Verificar integridad de la colección
on:
  workflow_dispatch:
  push:
    paths:
      - tools/auditar_publicacion.py
      - .github/workflows/audit-publication.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar lectores de formatos
        run: |
          python -m pip install PyMuPDF Pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Recuperar y comprobar todos los archivos
        run: python tools/auditar_publicacion.py
      - name: Conservar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-publicacion
          path: verification-results/
          if-no-files-found: warn
